[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boeing-clm"
version = "1.0.0"
description = "Boeing Contract Lifecycle Management (CLM) Engine for Gemini Agent (Spark) + M365 + BigQuery Vector Search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "fastmcp>=2.0.0",
    "google-cloud-bigquery>=3.25.0",
    "python-docx>=1.1.2",
    "lxml>=5.2.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
